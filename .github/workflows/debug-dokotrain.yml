name: debug-dokotrain
on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Runner 出口 IP
        run: |
          echo "== ipify =="
          curl -s --max-time 15 https://api.ipify.org; echo
          echo "== ipapi =="
          curl -s --max-time 15 https://ipinfo.io/json | head -c 500; echo
      - name: doko-train 裸探针
        run: |
          echo "== plain GET =="
          curl -s -i --max-time 20 "https://doko-train.jp/json/trainstatus/lines_status.json" | head -30
          echo
          echo "== HEAD =="
          curl -s -I --max-time 20 "https://doko-train.jp/json/trainstatus/lines_status.json"
      - name: doko-train 浏览器 UA + Referer
        run: |
          echo "== browser UA + Referer =="
          curl -s -i --max-time 20 "https://doko-train.jp/json/trainstatus/lines_status.json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" \
            -H "Referer: https://doko-train.jp/sp/" | head -30
      - name: Python urllib 复现 baker 请求
        run: |
          python3 - <<'EOF'
          import urllib.request, urllib.error, ssl, sys
          url = "https://doko-train.jp/json/trainstatus/lines_status.json"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          print("Python:", sys.version)
          for label, headers in [
              ("urllib+UA+Referer", {"User-Agent": UA, "Referer": "https://doko-train.jp/sp/"}),
              ("urllib+UA only", {"User-Agent": UA}),
              ("urllib+UA+Referer+AcceptEnc", {"User-Agent": UA, "Referer": "https://doko-train.jp/sp/", "Accept-Encoding": "gzip, deflate, br"}),
              ("urllib+UA+Referer+http11", {"User-Agent": UA, "Referer": "https://doko-train.jp/sp/", "Connection": "close"}),
          ]:
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      body = r.read()
                      print(f"{label}: HTTP {r.status}, {len(body)}B, ctype={r.headers.get('Content-Type')}")
                      print("  头:", dict((k.lower(),v[:60]) for k,v in r.headers.items()))
              except urllib.error.HTTPError as e:
                  body = e.read()[:300]
                  print(f"{label}: HTTPError {e.code}")
                  print("  响应体前300:", body)
              except Exception as e:
                  print(f"{label}: {type(e).__name__}: {e}")
          EOF
