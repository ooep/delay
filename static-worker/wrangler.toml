# jr-delay — delay 数据纯静态 Worker（仅资产，无 Worker 脚本，零计费）
# 由 bake-delays.yml 每次烘焙后组装 assets 并 wrangler deploy（哈希增量，秒级跳过）。
# 通过 routes 挂到主站数据域名同一路径：URL = https://jr-static.suki.ing/data/delay/*
# CORS 由 assets 根 _headers 提供（平台层应用，同样零 Worker 调用）。

name = "jr-delay"
compatibility_date = "2026-10-13"

routes = [
  { pattern = "jr-static.suki.ing/data/delay/*", zone_name = "suki.ing" },
]

[assets]
directory = "./assets"
not_found_handling = "404-page"
