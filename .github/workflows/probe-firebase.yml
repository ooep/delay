name: probe-firebase
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          set +e
          echo "=== 1) Firebase RTDB public read ==="
          for p in .json trains.json train_position.json positions.json train.json operation.json zaisen.json; do
            echo "--- mapp-91687-default-rtdb.firebaseio.com/$p"
            curl -skL -m 20 "https://mapp-91687-default-rtdb.firebaseio.com/$p" -w " [HTTP %{http_code} %{size_download}B]\n" | head -c 400
            echo
          done
          echo "=== 2) Firebase Remote Config REST ==="
          curl -sk -m 30 -X POST "https://firebaseremoteconfig.googleapis.com/v1/projects/mapp-91687/namespaces/firebase:fetchRemoteConfig?key=AIzaSyB_uHi1BV4pyknzJ_QGk1XrsaiLa4e12IQ" -H "Content-Type: application/json" -d '{"app_instance_id":"probe-0000-0000-0000-000000000001","app_instance_id_token":"probe-token","app_id":"1:110294926089:android:f496575c8a294c884789d8"}' -w " [HTTP %{http_code}]\n" | head -c 3000
          echo
          echo "=== 2b) Remote Config project ids ==="
          for pid in mapp-91687 tokyometro-myapp tokyometroapp tokyometrods; do
            echo "--- project $pid"
            curl -sk -m 20 -X POST "https://firebaseremoteconfig.googleapis.com/v1/projects/$pid/namespaces/firebase:fetchRemoteConfig?key=AIzaSyB_uHi1BV4pyknzJ_QGk1XrsaiLa4e12IQ" -H "Content-Type: application/json" -d '{"app_instance_id":"probe-0000-0000-0000-000000000001","app_instance_id_token":"probe-token","app_id":"1:110294926089:android:f496575c8a294c884789d8"}' | head -c 400
            echo
          done
          echo "=== 3) navitime train-location pages ==="
          for u in "https://trains.navitime.jp/" "https://www.navitime.co.jp/" "https://zaisen.navitime.jp/"; do
            echo "--- $u"
            curl -sk -m 20 -L -A "Mozilla/5.0" -w " [HTTP %{http_code} %{size_download}B]\n" "$u" | head -c 300
            echo
          done
        shell: bash
