name: collect-history

# Delay-history collector - FULLY INDEPENDENT from bake-delays.
#
# Runs ONCE per day during the overnight maintenance window (JST 02:30,
# after the last bake at JST 02:00 and before service resumes at 05:00),
# so it NEVER competes with the live bake for the main branch - zero
# push conflicts by construction.
#
# How it works: bake commits data/delays.json to git on every change
# (~every 10 min during service hours). This workflow replays yesterday's
# committed snapshots (fetch-depth: 0 -> full history available) and
# rebuilds that service day's delay records idempotently:
#   python -m baker.history_collector --data-dir data
# (replay-date defaults to yesterday JST). Re-running the same day is a
# byte-identical no-op, so a manual re-run can never corrupt the data.
#
# Storage: ONE gzip file per month (data/delay-history/YYYY-MM.json.gz,
# ~1.5 MB for a full month of every delayed train in Japan) + a global
# index.json -> 13 files/year, ~15 MB total. Records are compact
# (abbreviated fields, HH:MM timestamps); trains[] is insertion-ordered so
# clients can offset/limit slice for pagination. Files are gzip JSON;
# browsers decompress with DecompressionStream('gzip').

on:
  schedule:
    # JST 02:30 = UTC 17:30
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-history
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the collector replays delays.json snapshots
          # from git log. fetch-depth 1 would make it see nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Replay yesterday's delay history from git
        run: python -m baker.history_collector --data-dir data

      - name: Commit if changed
        run: |
          git config user.name "history[bot]"
          git config user.email "history@users.noreply.github.com"
          git add data/delay-history
          if git diff --cached --quiet; then
            echo "history unchanged"
          else
            git commit -m "delay-history: $(TZ=Asia/Tokyo date +'%Y-%m-%d') service day"
            # bake is idle during the maintenance window; still guard
            # against a concurrent manual dispatch.
            for i in 1 2 3; do
              git pull --no-rebase -X theirs origin main && git push && break
              echo "push retry $i"; sleep 10
            done
          fi
