name: probe-tokyometro-firebase
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-tm.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: bash
        run: |
          set -x
          KEY="AIzaSyB_uHi1BV4pyknzJ_QGk1XrsaiLa4e12IQ"
          IDT=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('idToken',''))" 2>/dev/null)
          echo "IDT len: ${#IDT}"
          echo "== Firestore root (Bearer) =="
          curl -s --max-time 20 "https://firestore.googleapis.com/v1/projects/mapp-91687/databases/(default)/documents?pageSize=20" -H "Authorization: Bearer $IDT" | head -c 4000; echo
          echo "== Firestore lines =="
          for c in lines map errors trains train positions announcements config; do
            r=$(curl -s --max-time 15 "https://firestore.googleapis.com/v1/projects/mapp-91687/databases/(default)/documents/$c?pageSize=3" -H "Authorization: Bearer $IDT" | head -c 500)
            echo "$c => $r"; echo
          done
          echo "== Firestore document lines/ginza =="
          curl -s --max-time 15 "https://firestore.googleapis.com/v1/projects/mapp-91687/databases/(default)/documents/lines/ginza" -H "Authorization: Bearer $IDT" | head -c 3000; echo
