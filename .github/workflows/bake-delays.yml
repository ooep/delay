name: bake-delays

# The whole pipeline in one workflow:
#   - every run: dokorail live feeds (+ JR own-source feeds) -> data/delays.json
#     (only the timetable bundles of lines with delayed trains are fetched)
#   - Sundays / when missing: refresh the slow-moving caches - dokorail
#     geometry catalog (data/lines.json) and jr.suki.ing's tmaps.json +
#     lines_map.json snapshots (data/suki/)
#
# jr.suki.ing reads data/delays.json via Cloudflare Workers Static Assets
# (jr-delay.suki.ing, pure static, zero-cost). Its by_suki_key table tags the
# site's own trains with zero join logic. Board carries generated_at so the
# UI can show its age; GitHub cron jitters, so treat this as a refreshed
# snapshot, not a realtime stream.
#
# 日本限定源的出口: あおなみ線/ハピラインNAVI 只接受日本 IP, runner 在美国,
# 所以它们的 AONAMI_BASE/HAPILINE_BASE 指向独立的 suki-jp-relay Worker
# (另一个 Cloudflare 账号, Placement Hints 钉在东京机房)。它只认本 workflow
# 现场签发的 GitHub OIDC 短时 JWT (aud=suki-jp-relay + repo/ref 校验, 无共享密钥);
# 生产 jr-delay 保持纯静态资产, 不跑任何脚本。
# comfort.json 也顺手镜像到 jr-delay, 主站第一消费源不再依赖 GitHub CDN。

on:
  schedule:
    # 运行窗口: 东京时间 05:00 - 次日 02:00 (JST = UTC+9)
    #   JST 05:00-26:00  =  UTC 20:00-23:59 (当日) + 00:00-17:00 (次日)
    # GitHub cron 有 5-20 分钟抖动, 窗口边缘的班次可能略偏
    - cron: "*/10 20-23 * * *"
    - cron: "*/10 0-16 * * *"
    - cron: "0 17 * * *"    # 最后一班: JST 02:00 整
  workflow_dispatch:

permissions:
  contents: write
  # lets baker.common.jp_relay_token mint the suki-jp-relay bearer
  id-token: write

concurrency:
  group: bake-delays
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # optional: ODPT consumer key (developer.odpt.org, free) enables
      # Keikyu/Tobu/YokohamaMunicipal via api.odpt.org; without it only
      # Toei comes through the keyless public mirror
      ODPT_KEY: ${{ secrets.ODPT_KEY }}
      # optional: Cloudflare API token for jr-delay deploy
      # (Workers Static Assets, pure static). Missing -> skip deploy.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # Reverse proxy for dokorail.jp to bypass Cloudflare runner-IP block.
      # Public Vercel edge; unset -> hits dokorail.jp directly.
      DOKORAIL_BASE: "https://dokorail-proxy.vercel.app"
      # Japan-only feeds via suki-jp-relay (Placement Hints -> Tokyo). The
      # modules mint a GitHub OIDC JWT per feed (common.jp_relay_token); the
      # Worker rejects everything that is not this workflow.
      # 直连 origin 只在本地/有日本出口时可用（模块默认值就是 origin）。
      AONAMI_BASE: "https://suki-jp-relay-7c41e9.lmc26817.workers.dev/jp/aonami"
      HAPILINE_BASE: "https://suki-jp-relay-7c41e9.lmc26817.workers.dev/jp/hapi"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Meitetsu trainlocation HTML parser uses BeautifulSoup; all other
      # operators stay stdlib-only.
      - name: Install Python deps
        run: pip install beautifulsoup4

      - name: Refresh caches (weekly or when missing)
        run: python -m baker.refresh --data-dir data

      - name: Bake delay board
        run: python -m baker.delays --data-dir data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commit if changed
        run: |
          git config user.name "baker[bot]"
          git config user.email "baker@users.noreply.github.com"
          git add data/delays.json data/sukijr.json data/lines.json data/suki
          if git diff --cached --quiet; then
            echo "board unchanged"
          else
            git commit -m "delays $(date -u +'%Y-%m-%dT%H:%MZ') $(python -c "import json;print(json.load(open('data/delays.json'))['delayed_count'])") late"
            # concurrent scheduled runs race on main - retry the push
            for i in 1 2 3 4 5; do
              git pull --no-rebase -X theirs origin main && git push && break
              echo "push retry $i"; sleep 10
            done
          fi

      # 把 jr-comfortable 的 comfort.json 镜像到自家域名（主站第一消费源）。
      # 尽力而为：全部源失败则本次不产出 comfort.json，Worker 继续服务上一次部署。
      - name: Mirror comfort.json onto jr-delay
        if: ${{ env.CF_API_TOKEN != '' }}
        run: python3 scripts/mirror_comfort.py

      # 部署到 Cloudflare jr-delay（纯静态资产，无 Worker 脚本，零计费）。
      # 域名路由 jr-delay.suki.ing/* 已在 Dashboard 创建，主站主源即
      # https://jr-delay.suki.ing/delays.json
      # wrangler 按内容哈希增量上传：数据未变化时秒级跳过。
      - name: Deploy delay JSON to Cloudflare (jr-delay)
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c75ed9a498500d7c232d9d59a353341d
        run: |
          python3 scripts/prepare_delay_assets.py
          npx wrangler@4 deploy --config static-worker/wrangler.toml 2>&1 | tail -12
