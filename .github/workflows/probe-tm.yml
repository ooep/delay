name: probe-tokyometro-fixture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-tm.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump fixture
        shell: bash
        run: |
          set -e
          KEY="AIzaSyB_uHi1BV4pyknzJ_QGk1XrsaiLa4e12IQ"
          IDT=$(curl -s -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY" -H 'Content-Type: application/json' -d '{"returnSecureToken":true}' | python3 -c "import sys,json;print(json.load(sys.stdin).get('idToken',''))")
          echo "IDT len: ${#IDT}"
          mkdir -p /tmp/fx
          for id in ginza marunouchi hibiya tozai chiyoda yurakucho hanzomon namboku fukutoshin asakusa mita shinjuku oedo; do
            curl -s --max-time 15 "https://firestore.googleapis.com/v1/projects/mapp-91687/databases/(default)/documents/tokyometro/$id" -H "Authorization: Bearer $IDT" -o /tmp/fx/$id.json
          done
          python3 -c "
          import json,glob,os,base64
          out={}
          for p in sorted(glob.glob('/tmp/fx/*.json')):
              lid=os.path.basename(p)[:-5]
              d=json.load(open(p))
              if 'error' in d:
                  out[lid]={'error':d['error'].get('message','')}
                  continue
              f=d.get('fields',{})
              tl=f.get('trainList',{}).get('stringValue','[]')
              try:
                  out[lid]=json.loads(tl)
              except Exception as e:
                  out[lid]={'parse_error':str(e)[:80]}
          raw=json.dumps(out,ensure_ascii=False).encode()
          b=base64.b64encode(raw).decode()
          print('B64LEN',len(b),'TOTAL',sum(len(v) for v in out.values() if isinstance(v,list)))
          for i in range(0,len(b),8000):
              print(b[i:i+8000])
          "
