name: bake-compat-test

# Full bake into a temp dir (no commit) + regression comparison against the
# committed board. Sources are ciphertext-only; see encryption/.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-tm.yml'
      - 'encrypted/**'
      - 'encryption/**'

permissions:
  contents: read

concurrency:
  group: bake-compat-test-${{ github.ref_name }}
  cancel-in-progress: true

env:
  LOG_MODE: ${{ vars.LOG_MODE }}
  SEALED_LOG: ${{ vars.SEALED_LOG }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Opaque env name: Actions echoes every env key into the job log.
      JK: ${{ secrets.ODPT_KEY }}
      SRC_1: ${{ secrets.SRC_1 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Step 1/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/5 bash encryption/prep.sh 1

      - name: Step 2/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/5 bash encryption/prep.sh 2

      - name: Step 3/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/5 bash ci/step.sh probe 3

      - name: Step 4/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 4/5 bash ci/step.sh probe 4

      - name: Step 5/5
        if: always()
        run: bash encryption/finalize.sh /tmp/bt
