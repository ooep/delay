name: bake-delays

# The whole pipeline in one workflow:
#   - every run: dokorail live feeds (+ JR own-source feeds) -> data/delays.json
#     (only the timetable bundles of lines with delayed trains are fetched)
#   - Sundays / when missing: refresh the slow-moving caches - dokorail
#     geometry catalog (data/lines.json) and jr.suki.ing's tmaps.json +
#     lines_map.json snapshots (data/suki/)
#
# jr.suki.ing reads data/delays.json via Cloudflare Workers Static Assets
# (jr-static.suki.ing/data/delay/*, pure static, zero-cost). Its by_suki_key
# table tags the site's own trains with zero join logic. Board carries
# generated_at so the UI can show its age; GitHub cron jitters, so treat
# this as a refreshed snapshot, not a realtime stream.

on:
  schedule:
    # 运行窗口: 东京时间 05:00 - 次日 02:00 (JST = UTC+9)
    #   JST 05:00-26:00  =  UTC 20:00-23:59 (当日) + 00:00-17:00 (次日)
    # GitHub cron 有 5-20 分钟抖动, 窗口边缘的班次可能略偏
    - cron: "*/10 20-23 * * *"
    - cron: "*/10 0-16 * * *"
    - cron: "0 17 * * *"    # 最后一班: JST 02:00 整
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-delays
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # optional: ODPT consumer key (developer.odpt.org, free) enables
      # Keikyu/Tobu/YokohamaMunicipal via api.odpt.org; without it only
      # Toei comes through the keyless public mirror
      ODPT_KEY: ${{ secrets.ODPT_KEY }}
      # optional: Cloudflare API token for jr-delay static deploy
      # (Workers Static Assets, pure static, zero-cost). Missing -> skip deploy.
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      # Reverse proxy for dokorail.jp to bypass Cloudflare runner-IP block.
      # Public Vercel edge; unset -> hits dokorail.jp directly.
      DOKORAIL_BASE: "https://dokorail-proxy.vercel.app"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh caches (weekly or when missing)
        run: python -m baker.refresh --data-dir data

      - name: Bake delay board
        run: python -m baker.delays --data-dir data

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Commit if changed
        run: |
          git config user.name "baker[bot]"
          git config user.email "baker@users.noreply.github.com"
          git add data/delays.json data/sukijr.json data/lines.json data/suki
          if git diff --cached --quiet; then
            echo "board unchanged"
          else
            git commit -m "delays $(date -u +'%Y-%m-%dT%H:%MZ') $(python -c "import json;print(json.load(open('data/delays.json'))['delayed_count'])") late"
            # concurrent scheduled runs race on main - retry the push
            for i in 1 2 3 4 5; do
              git pull --no-rebase -X theirs origin main && git push && break
              echo "push retry $i"; sleep 10
            done
          fi

      # 部署 delay JSON 到 Cloudflare jr-delay 静态 Worker（仅资产、零计费）。
      # 域名路由 jr-delay.suki.ing/* 已在 Dashboard 创建，主站主源即
      # https://jr-delay.suki.ing/delays.json
      # wrangler 按内容哈希增量上传：数据未变化时秒级跳过。
      - name: Deploy delay JSON to Cloudflare (jr-delay, static, zero-cost)
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c75ed9a498500d7c232d9d59a353341d
        run: |
          python3 scripts/prepare_delay_assets.py
          npx wrangler@4 deploy --config static-worker/wrangler.toml 2>&1 | tail -12
