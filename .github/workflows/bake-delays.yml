name: bake-delays

# Ciphertext-only repository (encrypted/**.enc + encryption/manifest.tsv).
# Plaintext exists only inside the runner workspace: step 1 verifies every
# blob (verify-only gate), step 2 re-verifies and materializes, the last
# step removes all plaintext and asserts a clean worktree.
# Keys/bases come from secrets (CODE_KEY, SRC_*); workflow text carries no
# upstream identifiers. Logs: encryption/logrun.sh (sealed by repo vars).

on:
  # 实际节奏由外部调度器每 5 分钟 dispatch 一次；下面的 cron 只是兜底
  # （GitHub 对高频 schedule 有节流，实测命中率很低）。两者共用同一个
  # concurrency 组，重叠时后到的一轮被取消，不会重复烘焙。
  schedule:
    # 运行窗口: 东京时间 05:00 - 次日 02:00 (JST = UTC+9)
    - cron: "*/10 20-23 * * *"
    - cron: "*/10 0-16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # OIDC minting for the JP egress relay (see encrypted baker code)
  id-token: write

concurrency:
  group: bake-delays-${{ github.ref_name }}
  cancel-in-progress: true

env:
  LOG_MODE: ${{ vars.LOG_MODE }}
  SEALED_LOG: ${{ vars.SEALED_LOG }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Opaque env name: Actions echoes every env key into the job log, so the
      # upstream-specific name must not appear there. Value is the same secret.
      JK: ${{ secrets.ODPT_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      RELAY_KEY: ${{ secrets.RELAY_KEY }}
      SRC_1: ${{ secrets.SRC_1 }}
      SRC_2: ${{ secrets.SRC_2 }}
      SRC_3: ${{ secrets.SRC_3 }}
      SRC_4: ${{ secrets.SRC_4 }}
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Step 1/8
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/8 bash encryption/prep.sh 1

      - name: Step 2/8
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/8 bash encryption/prep.sh 2

      # Timetable blobs are content addressed (`sha256/<hash>.json`) and served
      # immutable, the index carries max-age=86400. Carrying them between runs
      # turns a ~40 MiB pull every 10 minutes into roughly one a day. Nothing
      # about freshness changes: a republished table gets a new hash, and a new
      # hash is a miss by construction. Day-stamped key so exactly one run per
      # day saves; every later run restores and saves nothing.
      - name: Timetable cache key
        id: ttday
        run: echo "d=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore timetable cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        continue-on-error: true
        with:
          path: data/tt/cache
          key: tt-v3-${{ steps.ttday.outputs.d }}
          restore-keys: |
            tt-v3-

      - name: Cache status
        run: |
          d=data/tt/cache
          if [ -d "$d" ]; then
            echo "blobs: $(find "$d" -maxdepth 1 -name '*.json' | wc -l) files, $(du -sh "$d" | cut -f1)"
          else
            echo "cold cache"
          fi

      - name: Step 3/8
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/8 bash ci/step.sh bake 3

      - name: Step 4/8
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 4/8 bash ci/step.sh bake 4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      # Warm the npx cache so the deploy step does not re-download wrangler
      # on every run (~6-9s). A cache miss falls back to the normal download,
      # and continue-on-error keeps a cache outage from breaking the bake.
      # Main-only: only Step 7/8 (main-only itself) consumes wrangler; a
      # branch run never downloads it and would seal an empty cache entry.
      - name: Cache wrangler (npx)
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        continue-on-error: true
        with:
          path: ~/.npm
          key: wrangler-npx-v2

      - name: Step 5/8
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 5/8 bash ci/step.sh bake 5

      - name: Step 6/8
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 6/8 bash ci/step.sh bake 6

      - name: Step 7/8
        if: ${{ github.ref == 'refs/heads/main' && env.CF_API_TOKEN != '' }}
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Fallback keeps the 10-minute chain alive if the account secret is
          # absent (value already public in the pre-merge main workflow).
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || 'c75ed9a498500d7c232d9d59a353341d' }}
        run: bash encryption/logrun.sh 7/8 bash ci/step.sh bake 7

      - name: Step 8/8
        if: always()
        run: bash encryption/finalize.sh
