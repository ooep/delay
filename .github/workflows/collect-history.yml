name: collect-history

# Delay-history collector - FULLY INDEPENDENT from bake-delays.
# Runs once per day in the maintenance window (JST 02:30); replays the
# previous service day's committed snapshots idempotently. Sources are
# ciphertext-only; see encryption/ for the verify-then-write contract.

on:
  schedule:
    # JST 02:30 = UTC 17:30
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-history-${{ github.ref_name }}
  cancel-in-progress: true

env:
  LOG_MODE: ${{ vars.LOG_MODE }}
  SEALED_LOG: ${{ vars.SEALED_LOG }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # Full history: the collector replays snapshots from git log.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Step 1/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 1/5 bash encryption/prep.sh 1

      - name: Step 2/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 2/5 bash encryption/prep.sh 2

      - name: Step 3/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 3/5 bash ci/step.sh history 3

      - name: Step 4/5
        env:
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: bash encryption/logrun.sh 4/5 bash ci/step.sh history 4

      - name: Step 5/5
        if: always()
        run: bash encryption/finalize.sh
